name: Verify CryptoBench

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    # Pin the Docker E2E runner so the sandbox network contract is not changed
    # by the rolling ubuntu-latest image migration.
    runs-on: ubuntu-24.04
    env:
      # Hosted runners may expose routed bridge options without supporting
      # host port publishing on that network. The Agent remains on an
      # internal network; use the compatible proxy bridge for CI.
      DOCKER_PROXY_NETWORK_MODE: compatibility
      CRYPTOBENCH_DOCKER_PROXY_NETWORK_MODE: compatibility
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21.0.13'
          cache: maven

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Check frontend JavaScript and Vue templates
        run: npm run check

      - name: Verify report timing, categories, leaderboard and exports
        run: npm run test:report-metrics

      - name: Validate private evaluator catalog contract
        run: npm run validate:evaluator

      - name: Test evaluator catalog coverage guard
        run: npm run test:evaluator

      - name: Test V4 material manifest guard
        run: npm run test:v4-materials

      - name: Run backend tests and package
        run: bash start.sh --batch-mode verify

      - name: Install browser for isolated report workflow
        run: npx playwright install --with-deps chromium

      - name: Verify report and PK metrics through real APIs and browser
        run: npm run test:workflow:integration

      - name: Verify source launcher
        run: node tests/source-start.mjs

      - name: Verify Docker engine
        run: |
          docker version
          docker info --format '{{.ServerVersion}} {{.OperatingSystem}}'

      - name: Run Docker Agent sandbox E2E
        run: |
          set -o pipefail
          export DOCKER_DIAGNOSTIC_FILE="$RUNNER_TEMP/docker-sandbox.log"
          npm run test:docker 2>&1 | tee "$DOCKER_DIAGNOSTIC_FILE"

      - name: Upload Docker sandbox diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-sandbox-diagnostics
          path: ${{ runner.temp }}/docker-sandbox.log
          if-no-files-found: warn

      - name: Run platform Docker execution E2E
        run: npm run test:docker:e2e

  windows-package:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21.0.13'
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify data protection and desktop control
        shell: pwsh
        run: |
          .\tests\windows-data-safety.ps1
          .\tests\windows-wix-hook.ps1
          .\tests\windows-release-metadata.ps1
          .\mvnw.cmd --batch-mode '-Dtest=DesktopLauncherTest,DesktopInstanceTest,DesktopAdminServiceTest' test
          if ($LASTEXITCODE -ne 0) { throw 'Desktop tests failed' }

      - name: Build Windows app image
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path target/packaging-contamination | Out-Null
          Set-Content target/packaging-contamination/outbox.jsonl 'fixture-only; must not ship'
          .\scripts\package-windows.ps1 -AllowExternalOutput -OutputDir "$env:RUNNER_TEMP\cryptobench-app"

      - name: Verify app image layout
        shell: pwsh
        run: |
          $app = Join-Path $env:RUNNER_TEMP 'cryptobench-app\CryptoBench'
          if (-not (Test-Path -LiteralPath $app)) { throw "App image was not created: $app" }
          if (-not (Test-Path -LiteralPath (Join-Path $app 'CryptoBench.exe'))) { throw 'Desktop launcher executable is missing' }
          if (-not (Test-Path -LiteralPath (Join-Path $app 'runtime'))) { throw 'Bundled runtime is missing' }
          node tests/windows-package-content.mjs $app
          if ($LASTEXITCODE -ne 0) { throw 'Desktop payload verification failed' }

      - name: Smoke test Windows app image
        shell: pwsh
        run: node tests/windows-app-image.mjs "$env:RUNNER_TEMP\cryptobench-app\CryptoBench\CryptoBench.exe"

      - name: Reject incompatible prepared release images
        shell: pwsh
        run: .\tests\windows-prepared-image.ps1 -Image "$env:RUNNER_TEMP\cryptobench-app\CryptoBench"

      - name: Verify startup failures and crash recovery
        shell: pwsh
        run: node tests/windows-desktop-failures.mjs "$env:RUNNER_TEMP\cryptobench-app\CryptoBench\CryptoBench.exe"

      - name: Prepare portable WiX binaries
        shell: pwsh
        run: |
          $wixDir = Join-Path $env:GITHUB_WORKSPACE '.tools\wix314'
          New-Item -ItemType Directory -Force -Path $wixDir | Out-Null
          $zip = Join-Path $env:RUNNER_TEMP 'wix314-binaries.zip'
          Invoke-WebRequest -UseBasicParsing `
            'https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip' `
            -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne '6AC824E1642D6F7277D0ED7EA09411A508F6116BA6FAE0AA5F2C7DAA2FF43D31') { throw 'WiX checksum mismatch' }
          Expand-Archive -LiteralPath $zip -DestinationPath $wixDir -Force
          if (-not (Get-ChildItem $wixDir -Filter candle.exe -Recurse)) { throw 'WiX candle.exe was not downloaded' }
          if (-not (Get-ChildItem $wixDir -Filter light.exe -Recurse)) { throw 'WiX light.exe was not downloaded' }

      - name: Build Windows EXE installer
        shell: pwsh
        run: .\scripts\package-windows.ps1 -Installer -AllowExternalOutput -OutputDir "$env:RUNNER_TEMP\cryptobench-installer"

      - name: Verify Windows EXE installer artifact
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'cryptobench-installer\CryptoBench-1.0.0.exe'
          if (-not (Test-Path -LiteralPath $installer)) { throw "Installer was not created: $installer" }

      - name: Build Windows upgrade installer
        shell: pwsh
        run: .\scripts\package-windows.ps1 -Installer -AllowExternalOutput -AppVersion 1.0.1 -OutputDir "$env:RUNNER_TEMP\cryptobench-installer-upgrade"

      - name: Verify Windows installer lifecycle
        shell: pwsh
        run: |
          .\tests\windows-installer.ps1 `
            -InitialInstaller "$env:RUNNER_TEMP\cryptobench-installer\CryptoBench-1.0.0.exe" `
            -UpgradeInstaller "$env:RUNNER_TEMP\cryptobench-installer-upgrade\CryptoBench-1.0.1.exe" `
            -InstallRoot "$env:RUNNER_TEMP\CryptoBench 中文 custom install" `
            -LogDirectory "$env:RUNNER_TEMP\cryptobench-installer-logs"

      - name: Verify default installation directory
        shell: pwsh
        run: .\tests\windows-installer.ps1 -InitialInstaller "$env:RUNNER_TEMP\cryptobench-installer\CryptoBench-1.0.0.exe" -LogDirectory "$env:RUNNER_TEMP\cryptobench-default-install-logs"

      - name: Verify upgrade from the latest stable Windows release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $pages = gh api --paginate --slurp "repos/$env:GITHUB_REPOSITORY/releases"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve the historical upgrade baseline' }
          $releases = @($pages | ConvertFrom-Json | ForEach-Object { $_ } | ForEach-Object { $_ })
          $previous = $releases | Where-Object { -not $_.draft -and -not $_.prerelease -and $_.tag_name -match '^v\d+\.\d+\.\d+$' } | Sort-Object { [version]$_.tag_name.Substring(1) } -Descending | Select-Object -First 1
          if (-not $previous) { Write-Host 'No stable historical release exists; fresh and same-source upgrade tests completed.'; exit 0 }
          $oldVersion = [version]$previous.tag_name.Substring(1)
          if ($oldVersion.Build -ge 65535) { throw 'Choose a new MSI minor version before running the historical upgrade check' }
          $candidateVersion = '{0}.{1}.{2}' -f $oldVersion.Major, $oldVersion.Minor, ($oldVersion.Build + 1)
          $baselineDir = Join-Path $env:RUNNER_TEMP 'cryptobench-ci-baseline'
          .\scripts\resolve-windows-baseline.ps1 -Repository $env:GITHUB_REPOSITORY -Version $candidateVersion -OutputDir $baselineDir
          $baseline = Get-Content (Join-Path $baselineDir 'baseline.json') -Raw | ConvertFrom-Json
          if ($baseline.tag -ne $previous.tag_name) { throw 'Historical release changed during validation; retry against a consistent baseline' }
          $candidateDir = Join-Path $env:RUNNER_TEMP 'cryptobench-ci-candidate'
          .\scripts\package-windows.ps1 -Release -Installer -AppVersion $candidateVersion -AllowExternalOutput -OutputDir $candidateDir
          .\tests\windows-installer.ps1 -InitialInstaller $baseline.installer -InitialVersion $baseline.version -LegacyInitial -UpgradeInstaller (Join-Path $candidateDir "CryptoBench-$candidateVersion.exe") -UpgradeVersion $candidateVersion -InstallRoot "$env:RUNNER_TEMP\CryptoBench historical 中文 upgrade" -LogDirectory "$env:RUNNER_TEMP\cryptobench-historical-upgrade-logs"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: windows-package-diagnostics
          path: |
            ${{ runner.temp }}/cryptobench-*-logs/*.log
            tmp/desktop-check-*/**/var/logs/*.log
          if-no-files-found: ignore
