name: Verify CryptoBench

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Check frontend JavaScript and Vue templates
        run: npm run check

      - name: Run backend tests and package
        run: mvn --batch-mode verify

      - name: Run Docker Agent sandbox E2E
        run: npm run test:docker

      - name: Run platform Docker execution E2E
        run: npm run test:docker:e2e

      - name: Run Docker Compose deployment smoke test
        run: npm run test:compose

  windows-package:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build Windows app image
        shell: pwsh
        run: .\scripts\package-windows.ps1 -OutputDir "$env:RUNNER_TEMP\cryptobench-app"

      - name: Verify app image layout
        shell: pwsh
        run: |
          $app = Join-Path $env:RUNNER_TEMP 'cryptobench-app\CryptoBench'
          if (-not (Test-Path -LiteralPath $app)) { throw "App image was not created: $app" }
          if (-not (Test-Path -LiteralPath (Join-Path $app 'CryptoBench.exe'))) { throw 'Desktop launcher executable is missing' }
          if (-not (Test-Path -LiteralPath (Join-Path $app 'runtime'))) { throw 'Bundled runtime is missing' }

      - name: Smoke test Windows app image
        shell: pwsh
        run: node tests/windows-app-image.mjs "$env:RUNNER_TEMP\cryptobench-app\CryptoBench\CryptoBench.exe"
