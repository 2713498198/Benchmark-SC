name: Publish CryptoBench Windows release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build (for example v1.0.1)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Prepare WiX
        shell: pwsh
        run: |
          $dir = Join-Path $env:GITHUB_WORKSPACE '.tools\wix314'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $zip = Join-Path $env:RUNNER_TEMP 'wix314-binaries.zip'
          Invoke-WebRequest -UseBasicParsing 'https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip' -OutFile $zip
          Expand-Archive -LiteralPath $zip -DestinationPath $dir -Force
      - name: Build installer and portable package
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'cryptobench-release'
          $portable = Join-Path $env:RUNNER_TEMP 'cryptobench-portable'
          $tag = $env:RELEASE_TAG
          if ($tag -notmatch '^v(\d+\.\d+\.\d+)$') {
            throw "Release tag must match vMAJOR.MINOR.PATCH, received: $tag"
          }
          $version = $Matches[1]
          .\scripts\package-windows.ps1 -Installer -AppVersion $version -AllowExternalOutput -OutputDir $root
          .\scripts\package-windows.ps1 -AppVersion $version -AllowExternalOutput -OutputDir $portable
          Compress-Archive -Path (Join-Path $portable 'CryptoBench') -DestinationPath (Join-Path $root "CryptoBench-$tag-portable.zip") -Force
      - name: Create checksums
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'cryptobench-release'
          Get-ChildItem $root -Recurse -File | Get-FileHash -Algorithm SHA256 | ConvertTo-Csv -NoTypeInformation | Set-Content (Join-Path $root 'SHA256SUMS.csv')
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: |
            ${{ runner.temp }}/cryptobench-release/**/*.exe
            ${{ runner.temp }}/cryptobench-release/**/*.zip
            ${{ runner.temp }}/cryptobench-release/SHA256SUMS.csv
