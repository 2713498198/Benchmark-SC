name: Publish CryptoBench Windows release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build (for example v1.0.1)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21.0.13+9'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify source before packaging
        shell: pwsh
        run: |
          npm run check
          if ($LASTEXITCODE -ne 0) { throw "Frontend verification failed" }
          .\start.cmd --batch-mode verify
          if ($LASTEXITCODE -ne 0) { throw "Backend verification failed" }
      - name: Prepare WiX
        shell: pwsh
        run: |
          $dir = Join-Path $env:GITHUB_WORKSPACE '.tools\wix314'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $zip = Join-Path $env:RUNNER_TEMP 'wix314-binaries.zip'
          Invoke-WebRequest -UseBasicParsing 'https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip' -OutFile $zip
          Expand-Archive -LiteralPath $zip -DestinationPath $dir -Force
      - name: Build installer and portable package
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'cryptobench-release'
          $portable = Join-Path $env:RUNNER_TEMP 'cryptobench-portable'
          $tag = $env:RELEASE_TAG
          if ($tag -notmatch '^v(\d+\.\d+\.\d+)$') {
            throw "Release tag must match vMAJOR.MINOR.PATCH, received: $tag"
          }
          $version = $Matches[1]
          .\scripts\package-windows.ps1 -Installer -AppVersion $version -AllowExternalOutput -OutputDir $root
          .\scripts\package-windows.ps1 -AppVersion $version -AllowExternalOutput -OutputDir $portable
          Compress-Archive -Path (Join-Path $portable 'CryptoBench') -DestinationPath (Join-Path $root "CryptoBench-$tag-portable.zip") -Force
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE 'docs\INSTALL-WINDOWS.md') (Join-Path $root 'INSTALL-WINDOWS.md')
          .\scripts\create-release-manifest.ps1 -ReleaseDir $root -Version $version -Tag $tag -Commit $env:GITHUB_SHA
      - name: Verify release assets
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'cryptobench-release'
          $version = $env:RELEASE_TAG.Substring(1)
          foreach ($file in @("CryptoBench-$version.exe", "CryptoBench-$($env:RELEASE_TAG)-portable.zip", 'SHA256SUMS.csv', 'release-manifest.json', 'INSTALL-WINDOWS.md')) {
            if (-not (Test-Path -LiteralPath (Join-Path $root $file))) { throw "Missing release asset: $file" }
          }
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: |
            ${{ runner.temp }}/cryptobench-release/**/*.exe
            ${{ runner.temp }}/cryptobench-release/**/*.zip
            ${{ runner.temp }}/cryptobench-release/SHA256SUMS.csv
            ${{ runner.temp }}/cryptobench-release/release-manifest.json
            ${{ runner.temp }}/cryptobench-release/INSTALL-WINDOWS.md
