services:
  cryptobench:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${HOST_PORT:-4173}:4173"
    environment:
      SPRING_PROFILES_ACTIVE: local
      SERVER_ADDRESS: 0.0.0.0
      PORT: 4173
      # Keep source startup's local demo default; Compose requires an explicit opt-in.
      BENCHMARK_DEMOENABLED: "${CRYPTOBENCH_COMPOSE_DEMO_ENABLED:-false}"
      DB_URL: "jdbc:h2:file:/app/var/data/cryptobench;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE"
      CRYPTOBENCH_BOOTSTRAP_ADMIN_EMAIL: "${CRYPTOBENCH_BOOTSTRAP_ADMIN_EMAIL:-}"
      CRYPTOBENCH_BOOTSTRAP_ADMIN_NAME: "${CRYPTOBENCH_BOOTSTRAP_ADMIN_NAME:-}"
      CRYPTOBENCH_BOOTSTRAP_ADMIN_PASSWORD: "${CRYPTOBENCH_BOOTSTRAP_ADMIN_PASSWORD:-}"
      CRYPTOBENCH_DOCKER_ENABLED: "false"
      CRYPTOBENCH_INSTANCE_ID: "${CRYPTOBENCH_INSTANCE_ID:-${COMPOSE_PROJECT_NAME:-cryptobench-compose}}"
      CRYPTOBENCH_GATEWAY_ENABLED: "${CRYPTOBENCH_GATEWAY_ENABLED:-false}"
      CRYPTOBENCH_GATEWAY_IMAGE: "${CRYPTOBENCH_GATEWAY_IMAGE:-cryptobench-model-gateway:local}"
      CRYPTOBENCH_GATEWAY_PROVIDERS: "${CRYPTOBENCH_GATEWAY_PROVIDERS:-[]}"
      PASSWORD_RESET_DELIVERY_URL: "${PASSWORD_RESET_DELIVERY_URL:-}"
      PASSWORD_RESET_OUTBOX: "${PASSWORD_RESET_OUTBOX:-/app/var/mail/outbox.jsonl}"
      PASSWORD_RESET_BASE_URL: "${PASSWORD_RESET_BASE_URL:-http://127.0.0.1:4173}"
      CRYPTOBENCH_MAIL_MODE: "${CRYPTOBENCH_MAIL_MODE:-auto}"
      CRYPTOBENCH_MAIL_KEY_FILE: "${CRYPTOBENCH_MAIL_KEY_FILE:-/app/var/secrets/mail.key}"
      CRYPTOBENCH_SMTP_HOST: "${CRYPTOBENCH_SMTP_HOST:-}"
      CRYPTOBENCH_SMTP_PORT: "${CRYPTOBENCH_SMTP_PORT:-587}"
      CRYPTOBENCH_SMTP_USERNAME: "${CRYPTOBENCH_SMTP_USERNAME:-}"
      CRYPTOBENCH_SMTP_PASSWORD: "${CRYPTOBENCH_SMTP_PASSWORD:-}"
      CRYPTOBENCH_MAIL_FROM: "${CRYPTOBENCH_MAIL_FROM:-}"
      CRYPTOBENCH_SMTP_STARTTLS: "${CRYPTOBENCH_SMTP_STARTTLS:-true}"
      CRYPTOBENCH_SMTP_SSL: "${CRYPTOBENCH_SMTP_SSL:-false}"
    volumes:
      - ${CRYPTOBENCH_DATA_DIR:-./var}:/app/var
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:4173/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped

# Agent 沙箱由主机上的 Spring Boot 进程按每次运行动态创建。
# 不挂载 Docker socket，避免网站容器获得宿主机 Docker 管理权限。
