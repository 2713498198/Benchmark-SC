# Opt-in, self-contained local deployment. The regular compose.yaml keeps the
# website isolated from Docker. This profile adds the narrowly scoped local
# execution path and builds the Agent, proxy and optional model gateway images.
services:
  cryptobench:
    profiles: [sandbox]
    build:
      context: .
      dockerfile: Dockerfile.sandbox
    environment:
      # Inherit loopback publishing, demo policy and persistent H2 from compose.yaml.
      CRYPTOBENCH_DOCKER_ENABLED: "true"
      CRYPTOBENCH_DOCKER_ENDPOINT_HOST: host.docker.internal
      CRYPTOBENCH_DOCKER_PROXY_BIND_ADDRESS: 0.0.0.0
      CRYPTOBENCH_DOCKER_MOCK_IMAGE: cryptobench-mock-agent:compose
      CRYPTOBENCH_DOCKER_PROXY_IMAGE: cryptobench-agent-proxy:compose
      CRYPTOBENCH_GATEWAY_IMAGE: cryptobench-model-gateway:compose
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      mock-agent-image:
        condition: service_completed_successfully
      agent-proxy-image:
        condition: service_completed_successfully
      model-gateway-image:
        condition: service_completed_successfully

  mock-agent-image:
    profiles: [sandbox]
    image: cryptobench-mock-agent:compose
    build:
      context: ./tests/fixtures
      dockerfile: mock-agent.Dockerfile
    entrypoint: ["sh", "-c"]
    command: ["exit 0"]

  agent-proxy-image:
    profiles: [sandbox]
    image: cryptobench-agent-proxy:compose
    build:
      context: ./docker
      dockerfile: agent-proxy.Dockerfile
    entrypoint: ["sh", "-c"]
    command: ["exit 0"]

  model-gateway-image:
    profiles: [sandbox]
    image: cryptobench-model-gateway:compose
    build:
      context: ./docker
      dockerfile: model-gateway.Dockerfile
    entrypoint: ["sh", "-c"]
    command: ["exit 0"]
