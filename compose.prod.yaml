services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: cryptobench
      MYSQL_USER: "${DB_USERNAME:-cryptobench}"
      MYSQL_PASSWORD: "${DB_PASSWORD:?set DB_PASSWORD in .env.prod}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env.prod}"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  app:
    image: "${CRYPTOBENCH_IMAGE:-cryptobench:1.1.0}"
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CRYPTOBENCH_SOURCE_COMMIT: "${CRYPTOBENCH_SOURCE_COMMIT:-unknown}"
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_ADDRESS: 0.0.0.0
      PORT: 4173
      DB_URL: "jdbc:mysql://mysql:3306/cryptobench?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC"
      DB_USERNAME: "${DB_USERNAME:-cryptobench}"
      DB_PASSWORD: "${DB_PASSWORD:?set DB_PASSWORD in .env.prod}"
      CRYPTOBENCH_MAIL_MODE: "${CRYPTOBENCH_MAIL_MODE:-auto}"
      CRYPTOBENCH_MAIL_KEY_FILE: /app/var/secrets/mail.key
      CRYPTOBENCH_SMTP_HOST: "${CRYPTOBENCH_SMTP_HOST:-}"
      CRYPTOBENCH_SMTP_PORT: "${CRYPTOBENCH_SMTP_PORT:-587}"
      CRYPTOBENCH_SMTP_USERNAME: "${CRYPTOBENCH_SMTP_USERNAME:-}"
      CRYPTOBENCH_SMTP_PASSWORD: "${CRYPTOBENCH_SMTP_PASSWORD:-}"
      CRYPTOBENCH_MAIL_FROM: "${CRYPTOBENCH_MAIL_FROM:-}"
      CRYPTOBENCH_SMTP_STARTTLS: "${CRYPTOBENCH_SMTP_STARTTLS:-true}"
      CRYPTOBENCH_SMTP_SSL: "${CRYPTOBENCH_SMTP_SSL:-false}"
      CRYPTOBENCH_RUN_MAX_ACTIVE_PER_USER: "${CRYPTOBENCH_RUN_MAX_ACTIVE_PER_USER:-2}"
      CRYPTOBENCH_RUN_MAX_CREATED_PER_DAY_PER_USER: "${CRYPTOBENCH_RUN_MAX_CREATED_PER_DAY_PER_USER:-10}"
      CRYPTOBENCH_RUN_MAX_ACTIVE_GLOBAL: "${CRYPTOBENCH_RUN_MAX_ACTIVE_GLOBAL:-100}"
      CRYPTOBENCH_V4_SUITE_ROOT: /app/private/v4-suite
      CRYPTOBENCH_V4_PYTHON: python3
      CRYPTOBENCH_RUNNER_DOWNLOAD_DIR: /app/runner-package
      CRYPTOBENCH_DOCKER_ENABLED: "false"
    volumes:
      - app-var:/app/var
      - "${CRYPTOBENCH_RUNNER_PACKAGE_HOST_DIR:-./target/runner-package}:/app/runner-package"
      - "${CRYPTOBENCH_V4_SUITE_HOST_DIR:-./private/v4-suite}:/app/private/v4-suite:ro"
    depends_on:
      mysql:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: "${DOMAIN:?set DOMAIN in .env.prod}"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  mysql-data:
  app-var:
  caddy-data:
  caddy-config:
