# 自动化测试使用独立内存数据库，不读写开发环境的 H2 数据文件。
spring:
  datasource:
    # DB_CLOSE_DELAY=-1 保证测试应用运行期间连接短暂关闭不会清空内存数据。
    url: jdbc:h2:mem:cryptobench-test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
benchmark:
  # 允许测试构造体验账号；MockMvc 无 HTTPS，因此关闭 Secure Cookie。
  demo-enabled: true
  secure-cookie: false
  # 默认启动不导入旧数据；迁移测试单独构造并调用导入器。
  legacy-import-enabled: false
