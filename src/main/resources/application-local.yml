# 本地开发使用 H2 文件库，数据在重启后保留，无需单独安装数据库。
spring:
  datasource:
    # 文件路径相对于应用工作目录；MySQL 模式便于共用建表与查询语句。
    url: ${DB_URL:jdbc:h2:file:./var/data/cryptobench;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
benchmark:
  # 研究者和管理员体验入口仅供本地使用。
  demo-enabled: true
  password-reset:
    # 本地没有邮件服务时，将重置邮件写入项目数据目录，便于联调。
    # 需要真实邮件投递时可通过 PASSWORD_RESET_OUTBOX 覆盖，或配置 PASSWORD_RESET_DELIVERY_URL。
    outbox: ${PASSWORD_RESET_OUTBOX:./var/data/password-reset.outbox.jsonl}
  docker:
    enabled: ${CRYPTOBENCH_DOCKER_ENABLED:true}
    proxy-image: ${CRYPTOBENCH_DOCKER_PROXY_IMAGE:cryptobench-agent-proxy:local}
    endpoint-host: ${CRYPTOBENCH_DOCKER_ENDPOINT_HOST:127.0.0.1}
    proxy-bind-address: ${CRYPTOBENCH_DOCKER_PROXY_BIND_ADDRESS:127.0.0.1}
    allowed-images:
      - ${CRYPTOBENCH_DOCKER_MOCK_IMAGE:cryptobench-mock-agent:local}
