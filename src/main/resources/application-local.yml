# 本地开发直接连接本机 MySQL；数据库和表需提前创建。
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/cryptobench?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
benchmark:
  v4:
    # 本地完整题库已放在 gitignored 的 private 目录；生产部署应显式覆盖。
    suite-root: ${CRYPTOBENCH_V4_SUITE_ROOT:./private/cryptobench-sc-v4/170-20261112}
    python: ${CRYPTOBENCH_V4_PYTHON:python}
    budget-profiles: ${CRYPTOBENCH_V4_BUDGET_PROFILES:./private/cryptobench-sc-v4/170-20261112/configs/budget_profiles.json}
  password-reset:
    # Local development uses SMTP directly; leave the outbox unset so credentials
    # cannot silently degrade into writing verification codes to a local file.
    outbox: ${PASSWORD_RESET_OUTBOX:}
  mail:
    mode: ${CRYPTOBENCH_MAIL_MODE:smtp}
    worker-enabled: true
    key-file: ${CRYPTOBENCH_MAIL_KEY_FILE:./var/secrets/mail.key}
    smtp-host: ${SMTP_SERVER:}
    smtp-port: ${SMTP_PORT:587}
    smtp-username: ${SMTP_USER:}
    smtp-password: ${SMTP_PASSWORD:}
    from: "${SMTP_FROM:}"
    security: ${SMTP_SECURITY:}
  docker:
    enabled: ${CRYPTOBENCH_DOCKER_ENABLED:true}
    proxy-image: ${CRYPTOBENCH_DOCKER_PROXY_IMAGE:cryptobench-agent-proxy:local}
    endpoint-host: ${CRYPTOBENCH_DOCKER_ENDPOINT_HOST:127.0.0.1}
    proxy-bind-address: ${CRYPTOBENCH_DOCKER_PROXY_BIND_ADDRESS:127.0.0.1}
    allowed-images:
      - ${CRYPTOBENCH_DOCKER_MOCK_IMAGE:cryptobench-mock-agent:local}
