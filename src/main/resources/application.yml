# 各环境共用配置；application-local/prod.yml 会按激活的 profile 覆盖对应项。
spring:
  application:
    name: cryptobench
  profiles:
    # 未显式设置 SPRING_PROFILES_ACTIVE 时使用本地 H2 环境。
    default: local
  jackson:
    time-zone: UTC
  flyway:
    # 启动时执行 db/migration 下的版本化 SQL；已执行版本应保持不变。
    enabled: true
  mvc:
    problemdetails:
      enabled: false
# 默认仅监听本机；部署时可通过环境变量设置监听地址和端口。
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${PORT:4173}
  shutdown: graceful
  error:
    # 错误响应不暴露内部消息和堆栈；业务错误由 ApiExceptionHandler 统一处理。
    include-message: never
    include-stacktrace: never
  tomcat:
    # 表单大小限制；API JSON 请求体另由 RequestSizeFilter 按实际字节数限制。
    max-http-form-post-size: 5MB
management:
  # 只暴露健康检查，不向外显示组件细节。
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
benchmark:
  # 公共默认关闭体验账号，由 local profile 单独开放。
  demo-enabled: false
  docker:
    enabled: ${CRYPTOBENCH_DOCKER_ENABLED:false}
    proxy-image: ${CRYPTOBENCH_DOCKER_PROXY_IMAGE:cryptobench-agent-proxy:local}
    endpoint-host: ${CRYPTOBENCH_DOCKER_ENDPOINT_HOST:127.0.0.1}
    proxy-bind-address: ${CRYPTOBENCH_DOCKER_PROXY_BIND_ADDRESS:127.0.0.1}
    allowed-images:
      - ${CRYPTOBENCH_DOCKER_MOCK_IMAGE:cryptobench-mock-agent:local}
  v4:
    # 服务端私有 CryptoBench-SC V4 套件根目录（含 hidden/oracle 与逐题验证器）。
    # 留空时 workspace-validator 评分通道关闭，相关题目按未通过处理。
    suite-root: ${CRYPTOBENCH_V4_SUITE_ROOT:}
    python: ${CRYPTOBENCH_V4_PYTHON:python3}
    validator-timeout-seconds: ${CRYPTOBENCH_V4_VALIDATOR_TIMEOUT_SECONDS:120}
  gateway:
    enabled: ${CRYPTOBENCH_GATEWAY_ENABLED:false}
    image: ${CRYPTOBENCH_GATEWAY_IMAGE:cryptobench-model-gateway:local}
    # Public provider routing only; user API keys are never configuration values.
    # A nonempty providers list in an administrator YAML file takes precedence.
    providers: []
    providers-json: ${CRYPTOBENCH_GATEWAY_PROVIDERS:[]}
  # prod 默认启用 Secure Cookie，本地 HTTP 开发默认关闭。
  secure-cookie: ${SECURE_COOKIE:false}
  # 旧数据导入必须显式启用；相对源路径以应用工作目录为基准。
  legacy-import-enabled: ${LEGACY_IMPORT_ENABLED:false}
  legacy-db-file: ${CRYPTOBENCH_DB_FILE:data/runtime/db.json}
  admin:
    bootstrap:
      email: ${CRYPTOBENCH_BOOTSTRAP_ADMIN_EMAIL:}
      name: ${CRYPTOBENCH_BOOTSTRAP_ADMIN_NAME:}
      password: ${CRYPTOBENCH_BOOTSTRAP_ADMIN_PASSWORD:}
  password-reset:
    # 配置邮件网关 URL 后由后端投递 JSON；本地也可写入 outbox 文件联调。
    delivery-url: ${PASSWORD_RESET_DELIVERY_URL:}
    outbox: ${PASSWORD_RESET_OUTBOX:}
    base-url: ${PASSWORD_RESET_BASE_URL:http://127.0.0.1:4173}
  mail:
    # auto preserves existing HTTP gateway/outbox deployments; SMTP is explicit.
    mode: ${CRYPTOBENCH_MAIL_MODE:auto}
    key-file: ${CRYPTOBENCH_MAIL_KEY_FILE:var/secrets/mail.key}
    worker-enabled: ${CRYPTOBENCH_MAIL_WORKER_ENABLED:true}
    smtp-host: ${CRYPTOBENCH_SMTP_HOST:}
    smtp-port: ${CRYPTOBENCH_SMTP_PORT:587}
    smtp-username: ${CRYPTOBENCH_SMTP_USERNAME:}
    smtp-password: ${CRYPTOBENCH_SMTP_PASSWORD:}
    from: ${CRYPTOBENCH_MAIL_FROM:}
    smtp-starttls: ${CRYPTOBENCH_SMTP_STARTTLS:true}
    smtp-ssl: ${CRYPTOBENCH_SMTP_SSL:false}
  pricing:
    version: ${CRYPTOBENCH_PRICING_VERSION:cryptobench-price-table-1.0.0}
    models:
      "[gpt-4.1]":
        input-per-million-tokens: 2.0
        output-per-million-tokens: 8.0
      "[claude-sonnet-4]":
        input-per-million-tokens: 3.0
        output-per-million-tokens: 15.0
      "[deepseek-v3]":
        input-per-million-tokens: 0.27
        output-per-million-tokens: 1.1
      "[qwen3]":
        input-per-million-tokens: 0.8
        output-per-million-tokens: 2.0
      "[gemini-2.5-pro]":
        input-per-million-tokens: 1.25
        output-per-million-tokens: 10.0
